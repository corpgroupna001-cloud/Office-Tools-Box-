<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Email Signature Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="/design-system.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ws-text);
  background: var(--ws-bg);
  background-image:
    radial-gradient(at 15% 12%, hsla(258, 90%, 55%, 0.45) 0, transparent 45%),
    radial-gradient(at 85% 15%, hsla(200, 95%, 55%, 0.40) 0, transparent 45%),
    radial-gradient(at 50% 90%, hsla(320, 80%, 55%, 0.35) 0, transparent 50%);
  background-attachment: fixed;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 80px 24px 40px;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 22px 22px;
}

.container {
  width: 100%;
  max-width: 1200px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  position: relative;
  animation: ws-fade-in-up 0.35s ease-out both;
}

.glass {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border-radius: var(--ws-r-xl);
  border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 32px;
  box-shadow: var(--ws-shadow-lg);
}

h2 {
  color: var(--ws-text);
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: -0.01em;
}
h2 + .section-sub {
  color: var(--ws-text-muted);
  font-size: 12px; font-weight: 700;
  margin-bottom: 20px;
  text-transform: uppercase; letter-spacing: 1.5px;
}

label.field-label {
  display: block;
  color: var(--ws-text-muted);
  font-size: 10px; font-weight: 900;
  letter-spacing: 1.5px; text-transform: uppercase;
  margin: 14px 0 6px 4px;
}

input, select {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--ws-r-md);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--ws-border);
  color: var(--ws-text);
  font-family: inherit; font-size: 14px; font-weight: 600;
  margin-bottom: 10px;
  outline: none;
  transition: border-color var(--ws-motion), background var(--ws-motion), box-shadow var(--ws-motion);
}
input::placeholder { color: var(--ws-text-dim); }
input:focus, select:focus {
  border-color: var(--ws-primary);
  background: rgba(255, 255, 255, 0.09);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
}

select { appearance: none; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 14px center;
  padding-right: 40px;
}
select option { background: #1e293b; color: var(--ws-text); }

input[type="file"] { padding: 10px; font-size: 12px; }
input[type="file"]::file-selector-button {
  padding: 8px 14px; margin-right: 12px;
  border-radius: var(--ws-r-sm);
  border: none;
  background: var(--ws-grad-primary); color: white;
  font-family: inherit; font-weight: 800; font-size: 12px;
  cursor: pointer;
  transition: transform var(--ws-motion);
}
input[type="file"]::file-selector-button:hover { transform: translateY(-1px); }

button {
  width: 100%;
  padding: 14px;
  border-radius: var(--ws-r-md);
  border: none;
  background: var(--ws-grad-primary);
  color: white;
  font-family: inherit; font-size: 14px; font-weight: 900;
  cursor: pointer;
  transition: transform var(--ws-motion), box-shadow var(--ws-motion);
  box-shadow: var(--ws-primary-glow);
  margin-top: 4px;
  letter-spacing: 0.02em;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(59, 130, 246, 0.65);
}
button:active { transform: translateY(0); }

.mode-switch {
  display: flex;
  gap: 0;
  margin-bottom: 18px;
  padding: 4px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--ws-border);
  border-radius: var(--ws-r-md);
}
.mode-switch button {
  flex: 1; width: auto;
  background: transparent;
  color: var(--ws-text-muted);
  padding: 8px 12px;
  font-size: 12px; font-weight: 800;
  border-radius: var(--ws-r-sm);
  box-shadow: none;
  margin: 0;
  border: none;
  transition: background var(--ws-motion), color var(--ws-motion);
}
.mode-switch button:hover { color: var(--ws-text); background: rgba(255,255,255,0.05); transform: none; box-shadow: none; }
.mode-switch button.active {
  background: var(--ws-grad-primary);
  color: white;
  box-shadow: 0 4px 14px rgba(59,130,246,0.4);
}

.preview-shell {
  border-radius: var(--ws-r-md);
  padding: 24px;
  transition: background var(--ws-motion), border-color var(--ws-motion);
  overflow: auto;
  border: 1px solid var(--ws-border);
}
.preview-shell.light { background: #ffffff; color: #111; }
.preview-shell.dark  { background: #111827; }

#signature-preview,
#signature-preview * {
  font-family: "Arial Rounded MT Bold", Arial, sans-serif !important;
}

.page-title {
  position: absolute; top: -56px; left: 4px;
  color: var(--ws-text);
  font-size: 24px; font-weight: 900;
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 10px;
}
.page-title .page-title-icon {
  width: 36px; height: 36px; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--ws-grad-emerald);
  box-shadow: 0 8px 20px rgba(16,185,129,0.4);
}

@media (max-width: 900px) {
  .container { grid-template-columns: 1fr; }
  .page-title { position: static; margin-bottom: 20px; }
  body { padding-top: 60px; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/presence.js"></script>
<script src="/notifications.js"></script>
</head>

<body>

<div class="container">

  <div class="page-title">
    <span class="page-title-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 8.4c.5.5.8 1.1.8 1.6 0 1.1-.9 2-2 2h-4l-3 3-3-3H6a2 2 0 0 1-2-2 2 2 0 0 1 2-2h4l3-3 3 3h4c.5 0 1.1.3 1.6.8z"/><path d="M2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6"/></svg>
    </span>
    <span>Signature Generator</span>
  </div>

  <!-- FORM -->
  <div class="glass">

    <h2>Employee Details</h2>
    <p class="section-sub">Fill out your info — the preview updates live</p>

    <input id="name" placeholder="Full Name">
    <input id="title" placeholder="Job Title">

    <select id="companySelect" onchange="renderPreview()">
      <option value="">-- Select Company --</option>
      <option value="Jobways Point LLP">Jobways Point LLP</option>
      <option value="Nova Sportsmart Private Limited">Nova Sportsmart Private Limited</option>
      <option value="Protathlitis Sportsmart LLP">Protathlitis Sportsmart LLP</option>
      <option value="Navyug Raise A Player Foundation">Navyug Raise A Player Foundation</option>
      <option value="GenieLamp Private Limited">GenieLamp Private Limited</option>
    </select>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <label style="color:white;font-size:14px;white-space:nowrap">
        Company Colour:
      </label>

      <input
        type="color"
        id="companyColor"
        value="#dc2626"
        style="width:48px;height:38px;padding:2px 4px;margin-bottom:0;cursor:pointer;border-radius:8px"
        oninput="renderPreview()"
      >
    </div>

    <input id="phone" placeholder="Mobile">
    <input id="email" placeholder="Email">
    <input id="website" placeholder="Website">
    <input id="address" placeholder="Address">

    <input
      type="file"
      id="logoUpload"
      accept="image/*"
    >

    <input
      id="logoLink"
      placeholder="Company Website / Logo Redirect URL"
    >

    <h2 style="margin-top:15px;">Social Links</h2>

    <input id="linkedin" placeholder="LinkedIn URL">
    <input id="facebook" placeholder="Facebook URL">
    <input id="instagram" placeholder="Instagram URL">
    <input id="youtube" placeholder="YouTube URL">

    <button onclick="copySignature()">
      Copy Outlook Signature
    </button>

  </div>

  <!-- PREVIEW -->
  <div class="glass">

    <h2>Signature Preview</h2>
    <p class="section-sub">Copy the block below and paste into Gmail / Outlook / Apple Mail</p>

    <div class="mode-switch">
      <button
        type="button"
        id="lightBtn"
        class="active"
        onclick="setPreviewMode('light')"
      >
        Light Mode
      </button>

      <button
        type="button"
        id="darkBtn"
        onclick="setPreviewMode('dark')"
      >
        Dark Mode
      </button>
    </div>

    <div id="previewShell" class="preview-shell light">
      <div id="signature-preview"></div>
    </div>

  </div>

</div>

<script>
let currentMode = "light";
let logoDataUrl = "";

function escapeHtml(str){
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function normalizeUrl(url){

  if(!url) return "";

  if(!/^https?:\/\//i.test(url)){
    return "https://" + url;
  }

  return url;
}

function safeUrl(url){

  try{

    const normalized = normalizeUrl(url);
    const parsed = new URL(normalized);

    if(
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    ){
      return parsed.href;
    }

    return "";

  }catch{
    return "";
  }
}

function cleanWebsite(url){

  return url
    .replace(/^https?:\/\//i, "")
    .replace(/^www\./i, "")
    .replace(/\/$/, "");
}

function setPreviewMode(mode){

  currentMode = mode;

  const shell = document.getElementById("previewShell");
  const lightBtn = document.getElementById("lightBtn");
  const darkBtn = document.getElementById("darkBtn");

  shell.classList.remove("light", "dark");
  shell.classList.add(mode);

  lightBtn.classList.toggle("active", mode === "light");
  darkBtn.classList.toggle("active", mode === "dark");

  renderPreview();
}

const inputs = [
  "name",
  "title",
  "phone",
  "email",
  "website",
  "address",
  "linkedin",
  "facebook",
  "instagram",
  "youtube",
  "logoLink"
];

inputs.forEach(id => {

  document
    .getElementById(id)
    .addEventListener("input", renderPreview);

});

function buildSignatureHTML(){

  const name = escapeHtml(
    document.getElementById("name").value
  );

  const title = escapeHtml(
    document.getElementById("title").value
  );

  const company = escapeHtml(
    document.getElementById("companySelect").value
  );

  const companyColor =
    document.getElementById("companyColor").value;

  const phone = escapeHtml(
    document.getElementById("phone").value
  );

  const email = escapeHtml(
    document.getElementById("email").value
  );

  const website = safeUrl(
    document.getElementById("website").value.trim()
  );

  const cleanWebsiteText = website
    ? cleanWebsite(website)
    : "";

  const address = escapeHtml(
    document.getElementById("address").value
  );

  const logoLink = safeUrl(
    document.getElementById("logoLink").value.trim()
  );

  const linkedin = safeUrl(
    document.getElementById("linkedin").value.trim()
  );

  const facebook = safeUrl(
    document.getElementById("facebook").value.trim()
  );

  const instagram = safeUrl(
    document.getElementById("instagram").value.trim()
  );

  const youtube = safeUrl(
    document.getElementById("youtube").value.trim()
  );

  const textColor =
    currentMode === "dark"
      ? "#f3f4f6"
      : "#111111";

  const secondaryColor =
    currentMode === "dark"
      ? "#d1d5db"
      : "#4b5563";

  const borderColor =
    currentMode === "dark"
      ? "#374151"
      : "#e5e7eb";

  const bgColor =
    currentMode === "dark"
      ? "#111827"
      : "#ffffff";

  const iconBg =
    currentMode === "dark"
      ? "#1f2937"
      : "#ffffff";

  const logoImage = logoDataUrl
    ? `
      <img
        src="${logoDataUrl}"
        alt="Logo"
        style="
          width:180px;
          max-width:180px;
          display:block;
          margin:0 auto 10px;
          border:0;
          outline:none;
        "
      >
    `
    : "";

  const logoHtml =
    logoLink && logoImage
      ? `
        <a
          href="${logoLink}"
          target="_blank"
          rel="noopener noreferrer"
          style="
            text-decoration:none;
            border:none;
            display:inline-block;
          "
        >
          ${logoImage}
        </a>
      `
      : logoImage;

  function iconCell(src, href, alt){

    if(!href) return "";

    return `
      <td
        style="
          padding-right:3px;
          vertical-align:middle;
        "
      >

        <a
          href="${href}"
          target="_blank"
          rel="noopener noreferrer"
          style="
            display:inline-block;
            line-height:0;
            text-decoration:none;
            border:none;
          "
        >

          <span
            style="
              width:34px;
              height:34px;
              display:block;
              border-radius:50%;
              overflow:hidden;
              background:${iconBg};
            "
          >

            <img
              src="${src}"
              alt="${alt}"
              width="28"
              height="28"
              style="
                width:28px;
                height:28px;
                display:block;
                border:0;
                outline:none;
                margin:3px;
                object-fit:contain;
              "
            >

          </span>

        </a>

      </td>
    `;
  }

  const socialRow = `
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        margin:6px auto 0;
        border-collapse:collapse;
      "
    >
      <tr>

        ${iconCell(
          "https://upload.wikimedia.org/wikipedia/commons/f/f8/LinkedIn_icon_circle.svg",
          linkedin,
          "LinkedIn"
        )}

        ${iconCell(
          "https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Facebook_f_logo_%282019%29.svg/960px-Facebook_f_logo_%282019%29.svg.png",
          facebook,
          "Facebook"
        )}

        ${iconCell(
          "https://toppng.com/uploads/preview/instagram-logo-circle-11549679754rhbcorxntv.png",
          instagram,
          "Instagram"
        )}

        ${iconCell(
          "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/YouTube_social_red_circle_%282017%29.svg/960px-YouTube_social_red_circle_%282017%29.svg.png",
          youtube,
          "YouTube"
        )}

      </tr>
    </table>
  `;

  const phoneHtml = phone
    ? `
      <div>
        <strong>Mobile:</strong>
        <span style="font-family:Verdana, sans-serif;font-style:italic;">
          ${phone}
        </span>
      </div>
    `
    : "";

  const emailHtml = email
    ? `
      <div>
        <strong>Email:</strong>
        <span style="font-family:Verdana, sans-serif;font-style:italic;">
          ${email}
        </span>
      </div>
    `
    : "";

  const websiteHtml = website
    ? `
      <div>
        <strong>Web:</strong>

        <a
          href="${website}"
          target="_blank"
          rel="noopener noreferrer"
          style="
            font-family:Verdana, sans-serif;
            font-style:italic;
            color:#111111;
            text-decoration:none;
          "
        >
          ${cleanWebsiteText}
        </a>
      </div>
    `
    : "";

  const addressHtml = address
    ? `
      <div style="margin-top:6px;">
        <strong>Address:</strong>

        <span
          style="
            font-family:Verdana, sans-serif;
            font-style:italic;
          "
        >
          ${address}
        </span>
      </div>
    `
    : "";

  return `
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        border-collapse:collapse;
        background:${bgColor};
        color:${textColor};
        font-family:'Arial Rounded MT Bold', Arial, sans-serif;
      "
    >

      <tr>

        <td
          style="
            width:220px;
            padding-right:20px;
            vertical-align:top;
            text-align:center;
          "
        >

          ${logoHtml}

          ${socialRow}

        </td>

        <td
          style="
            border-left:2px solid ${borderColor};
            padding-left:20px;
            vertical-align:middle;
          "
        >

          <div
            style="
              font-size:20px;
              font-weight:700;
              line-height:1.2;
              color:${textColor};
            "
          >
            ${name}
          </div>

          <div
            style="
              font-size:14px;
              line-height:1.5;
              color:${secondaryColor};
            "
          >
            ${title}
          </div>

          <div
            style="
              font-size:14px;
              line-height:1.5;
              color:${companyColor};
              font-weight:700;
              margin-bottom:8px;
            "
          >
            ${company}
          </div>

          <div
            style="
              font-size:14px;
              line-height:1.6;
              color:${textColor};
            "
          >

            ${phoneHtml}

            ${emailHtml}

            ${websiteHtml}

            ${addressHtml}

          </div>

        </td>

      </tr>

    </table>
  `;
}

function renderPreview(){

  document.getElementById(
    "signature-preview"
  ).innerHTML = buildSignatureHTML();
}

document
  .getElementById("logoUpload")
  .addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

      logoDataUrl = e.target.result;

      renderPreview();
    };

    reader.readAsDataURL(file);
});

async function copySignature(){

  const html = buildSignatureHTML();

  try{

    const blob = new Blob(
      [html],
      { type:"text/html" }
    );

    const textBlob = new Blob(
      [
        html
          .replace(/<br>/g, "\n")
          .replace(/<[^>]*>/g, "")
      ],
      { type:"text/plain" }
    );

    await navigator.clipboard.write([
      new ClipboardItem({
        "text/html": blob,
        "text/plain": textBlob
      })
    ]);

    alert(
      "Signature copied. Paste into Outlook signature editor."
    );

  }catch(err){

    const temp = document.createElement("div");

    temp.innerHTML = html;

    document.body.appendChild(temp);

    const range = document.createRange();

    range.selectNode(temp);

    const sel = window.getSelection();

    sel.removeAllRanges();

    sel.addRange(range);

    document.execCommand("copy");

    sel.removeAllRanges();

    document.body.removeChild(temp);

    alert(
      "Signature copied. Paste into Outlook signature editor."
    );
  }
}

renderPreview();
setPreviewMode("light");
</script>

</body>
</html>
