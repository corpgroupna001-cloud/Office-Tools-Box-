<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/authguard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Call · WorkSuite</title>
    <meta name="theme-color" content="#0b1017">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/presence.js"></script>
    <link rel="stylesheet" href="/call/call.css">
</head>
<!--
  The call window. Opened by /calls.js as a popup on desktop (so moving
  between WorkSuite pages never drops a call) and in the same tab on
  phones. Everything it shows is driven by call/call.js; call/mesh.js
  carries the media.
-->
<body class="phase-preparing">
    <header class="topbar">
        <div class="tb-who">
            <span class="tb-avatar" id="tb-avatar" aria-hidden="true"></span>
            <div class="tb-text">
                <b id="tb-title">WorkSuite call</b>
                <span id="tb-sub">Preparing…</span>
            </div>
        </div>
        <div class="tb-right">
            <span class="quality" id="tb-quality" hidden title="Connection quality"><i></i><i></i><i></i><em></em></span>
            <span class="tb-count" id="tb-count" hidden></span>
        </div>
    </header>

    <main class="stage" id="stage" aria-label="Call">
        <div class="tiles" id="tiles"></div>
        <div class="tile self" id="self-tile" hidden>
            <video id="self-video" autoplay playsinline muted></video>
            <div class="tile-avatar" id="self-avatar"></div>
            <div class="tile-label"><span class="mic-off" hidden aria-label="Microphone off">
                <svg viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 1-1.2 3.9M15 9.3V5a3 3 0 0 0-5.8-1M9 9v2a3 3 0 0 0 5.1 2.1M12 18v4M8 22h8M5 11a7 7 0 0 0 11 5.7M3 3l18 18"/></svg></span><span>You</span></div>
        </div>
    </main>

    <!-- Everything that is not the live call: preparing, incoming, calling, ended, errors. -->
    <section class="panel" id="panel" aria-live="polite">
        <div class="panel-avatar" id="panel-avatar" aria-hidden="true"></div>
        <h1 id="panel-title">Preparing your call…</h1>
        <p id="panel-sub"></p>
        <div class="panel-help" id="panel-help" hidden></div>
        <div class="panel-actions" id="panel-actions"></div>
        <p class="panel-foot" id="panel-foot"></p>
    </section>

    <nav class="controls" id="controls" aria-label="Call controls" hidden>
        <button type="button" class="ctl" id="btn-mic" aria-pressed="true" title="Mute (M)">
            <svg class="on" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M19 11a7 7 0 0 1-1.2 3.9M15 9.3V5a3 3 0 0 0-5.8-1M9 9v2a3 3 0 0 0 5.1 2.1M12 18v4M8 22h8M5 11a7 7 0 0 0 11 5.7M3 3l18 18"/></svg>
            <span>Mute</span>
        </button>
        <button type="button" class="ctl" id="btn-cam" aria-pressed="false" title="Camera (V)">
            <svg class="on" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M16 16v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2M10 5h4a2 2 0 0 1 2 2v3.3l6-3.3v10M3 3l18 18"/></svg>
            <span>Camera</span>
        </button>
        <button type="button" class="ctl" id="btn-flip" hidden title="Switch camera">
            <svg viewBox="0 0 24 24"><path d="M20 7h-3.2L15 4H9L7.2 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/><path d="M9 13.5a3 3 0 0 1 5.2-2M15 12.5a3 3 0 0 1-5.2 2M14.5 9.5v2h-2M9.5 16.5v-2h2"/></svg>
            <span>Flip</span>
        </button>
        <button type="button" class="ctl" id="btn-share" hidden aria-pressed="false" title="Share your screen">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M12 13V7M9 10l3-3 3 3"/></svg>
            <span>Share</span>
        </button>
        <button type="button" class="ctl" id="btn-devices" title="Microphone, camera and speaker">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
            <span>Devices</span>
        </button>
        <button type="button" class="ctl end" id="btn-hangup" title="Hang up">
            <svg viewBox="0 0 24 24"><path d="M21 15.5v2a2 2 0 0 1-2.2 2 16 16 0 0 1-3.8-1.1 2 2 0 0 1-1.1-2.2l.3-1.4a12 12 0 0 0-4.4 0l.3 1.4A2 2 0 0 1 9 18.4 16 16 0 0 1 5.2 19.5 2 2 0 0 1 3 17.5v-2c0-.6.3-1.2.8-1.5a14 14 0 0 1 16.4 0c.5.3.8.9.8 1.5Z" transform="rotate(0 12 12)"/></svg>
            <span>End</span>
        </button>
    </nav>

    <div class="sheet" id="devices" role="dialog" aria-modal="true" aria-labelledby="devices-title" hidden>
        <div class="sheet-card">
            <div class="sheet-head"><b id="devices-title">Devices &amp; connection</b><button type="button" class="x" id="devices-close" aria-label="Close">✕</button></div>
            <label for="dev-mic">Microphone</label>
            <select id="dev-mic"></select>
            <label for="dev-cam">Camera</label>
            <select id="dev-cam"></select>
            <div id="dev-speaker-row">
                <label for="dev-speaker">Speaker</label>
                <select id="dev-speaker"></select>
            </div>
            <p class="sheet-note" id="dev-note"></p>
            <div class="conn" aria-live="polite">
                <b>Connection</b>
                <p id="conn-relay">Relay server: checking…</p>
                <ul id="conn-peers"></ul>
            </div>
        </div>
    </div>

    <button type="button" class="unlock" id="unlock" hidden>🔊 Tap to turn on sound</button>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="audios" hidden></div>

    <script src="/call/mesh.js"></script>
    <script src="/call/call.js"></script>
</body>
</html>
