# Checks for every pull request and for main. The same commands run locally:
# see README.md. Nothing here deploys, sends mail or touches Supabase: the
# database tests use an in-process Postgres and the browser tests use fixtures.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static checks, lint, types, unit and database tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # check (references, pinned/vendored assets, vercel.json limits, migrations),
      # lint, typecheck, then npm test. Database tests fail if PGlite is missing.
      - run: npm run verify
      - run: npm audit --audit-level=high

  browser:
    name: Browser smoke tests and WebRTC calls
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner image ships Google Chrome at /usr/bin/google-chrome, which the
      # harnesses find on their own (CHROME_PATH overrides).
      - run: npm run smoke:ui
      - run: npm run test:calls
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/ui-smoke/out/
          retention-days: 7

  desktop:
    name: Desktop shell dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm audit --audit-level=high
        working-directory: desktop

  android:
    name: Android build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
        working-directory: mobile/android
