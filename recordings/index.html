<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday WFH Check-in · WorkSuite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/design-system.css">
    <script defer src="/commandpalette.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: var(--ws-bg);
            background-image:
                radial-gradient(at 15% 12%, hsla(258, 90%, 55%, 0.5) 0, transparent 45%),
                radial-gradient(at 85% 15%, hsla(200, 95%, 55%, 0.4) 0, transparent 45%),
                radial-gradient(at 50% 90%, hsla(320, 80%, 55%, 0.35) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--ws-text);
            padding: 80px 20px 60px;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none;
            background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .container { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

        .hero {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 24px;
        }
        .hero .ic {
            width: 56px; height: 56px; border-radius: 18px;
            display: inline-flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg,#f43f5e,#a855f7);
            box-shadow: 0 12px 30px rgba(168,85,247,0.5);
        }
        .hero h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.01em; margin: 0; }
        .hero .sub { font-size: 13px; color: var(--ws-text-muted); font-weight: 700; margin-top: 2px; }

        .card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent);
            pointer-events: none;
        }
        .card > * { position: relative; z-index: 1; }

        .rules {
            background: rgba(139,92,246,0.10);
            border: 1px solid rgba(139,92,246,0.25);
            border-radius: 18px;
            padding: 14px 18px;
            font-size: 12.5px; color: #ddd6fe;
            margin-bottom: 20px;
            line-height: 1.55;
        }
        .rules strong { color: #f8fafc; }
        .rules ul { margin: 6px 0 0; padding-left: 20px; }
        .rules li { margin: 3px 0; }

        video.stream, video.preview {
            width: 100%;
            border-radius: 18px;
            background: #000;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            border: 1px solid rgba(255,255,255,0.08);
        }
        @media (min-aspect-ratio: 4/3) {
            video.stream, video.preview { aspect-ratio: 16 / 9; }
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 22px; border-radius: 16px;
            font-weight: 900; font-size: 14px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.08); color: #fff;
            transition: transform .15s, background .15s, box-shadow .15s;
            font-family: inherit;
        }
        .btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.primary { background: linear-gradient(135deg,#3b82f6,#6366f1); border-color: transparent; box-shadow: 0 8px 20px rgba(59,130,246,0.45); }
        .btn.record  { background: linear-gradient(135deg,#ef4444,#b91c1c); border-color: transparent; box-shadow: 0 8px 20px rgba(239,68,68,0.5); padding-left: 40px; position: relative; }
        .btn.record::before {
            content: ''; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            width: 12px; height: 12px; border-radius: 50%; background: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
            animation: rec-blink 1s ease-in-out infinite;
        }
        @keyframes rec-blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

        .rec-status {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px; font-weight: 800;
            padding: 6px 12px; border-radius: 999px;
            background: rgba(255,255,255,0.06); color: #94a3b8;
        }
        .rec-status.live { color: #fecaca; background: rgba(239,68,68,0.14); }
        .rec-status.done { color: #6ee7b7; background: rgba(16,185,129,0.14); }

        .action-row {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            margin-top: 16px;
        }

        .history {
            margin-top: 28px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 18px 20px;
        }
        .history h3 { font-size: 14px; font-weight: 900; margin-bottom: 10px; color: var(--ws-text); }
        .h-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 4px;
            font-size: 13px; color: var(--ws-text-muted); font-weight: 700;
        }
        .h-row + .h-row { border-top: 1px solid rgba(255,255,255,0.05); }
        .h-row b { color: var(--ws-text); }
        .h-row .tag { font-size: 10px; font-weight: 900; padding: 3px 10px; border-radius: 999px; background: rgba(16,185,129,0.18); color: #6ee7b7; }

        /* Gated states (not-friday, not-wfh, not-logged-in) */
        .gate {
            text-align: center;
            padding: 40px 24px;
        }
        .gate .gate-ic {
            width: 72px; height: 72px; margin: 0 auto 20px;
            border-radius: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 32px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .gate.calendar .gate-ic { background: linear-gradient(135deg,#3b82f6,#6366f1); }
        .gate.wfh      .gate-ic { background: linear-gradient(135deg,#94a3b8,#64748b); }
        .gate.locked   .gate-ic { background: linear-gradient(135deg,#f43f5e,#a855f7); }
        .gate h2 { font-size: 22px; font-weight: 900; margin-bottom: 8px; }
        .gate p { color: var(--ws-text-muted); font-size: 14px; max-width: 420px; margin: 0 auto 20px; line-height: 1.55; }

        .day-strip {
            display: flex; justify-content: center; gap: 6px;
            margin: 20px 0 8px;
        }
        .day-strip .d {
            width: 40px; padding: 8px 0; border-radius: 10px;
            font-size: 11px; font-weight: 900; color: #64748b;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            text-transform: uppercase; letter-spacing: 1px;
            text-align: center;
        }
        .day-strip .d.today { color: #cbd5e1; background: rgba(255,255,255,0.08); }
        .day-strip .d.friday { color: #fff; background: linear-gradient(135deg,#3b82f6,#6366f1); border-color: transparent; box-shadow: 0 8px 20px rgba(59,130,246,0.35); }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 14px 24px; border-radius: 999px;
            font-size: 13px; font-weight: 800;
            z-index: 100; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
            display: none; backdrop-filter: blur(20px);
        }
        .toast.show { display: block; animation: toast-in .25s ease-out; }
        @keyframes toast-in { from { transform: translate(-50%, 20px); opacity: 0 } to { transform: translate(-50%, 0); opacity: 1 } }
        .toast.success { border-color: rgba(16,185,129,0.35); color: #6ee7b7; }
        .toast.error   { border-color: rgba(239,68,68,0.35);  color: #fca5a5; }

        .progress-bar { margin-top: 12px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; display: none; }
        .progress-bar.show { display: block; }
        .progress-bar .fill { height: 100%; background: linear-gradient(90deg,#3b82f6,#8b5cf6); width: 0%; transition: width .2s; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/presence.js"></script>
    <script src="/notifications.js"></script>
</head>
<body>

<div class="container">
    <div class="hero">
        <div class="ic">
            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
        <div>
            <h1>Friday WFH Check-in</h1>
            <p class="sub" id="hero-sub">Record a short back-camera video of your workspace</p>
        </div>
    </div>

    <!-- Dynamic body: gate OR recorder OR done -->
    <div id="body"></div>

</div>

<div id="toast" class="toast"></div>

<script>
    // ---------- Supabase bootstrap ----------
    let sb = null;
    let user = null;
    let profile = null;
    let stream = null;
    let recorder = null;
    let recBlob = null;
    let recSecs = 0;
    let recTicker = null;

    function ymd(d) { return d.toISOString().slice(0, 10); }
    function todaysFriday() {
        // Returns today's date if today is Friday, else null.
        const d = new Date();
        return d.getDay() === 5 ? d : null;
    }
    function nextFriday() {
        const d = new Date();
        const daysToFri = (5 - d.getDay() + 7) % 7 || 7; // 1..7
        d.setDate(d.getDate() + daysToFri);
        return d;
    }
    function fmtDate(d) {
        return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    async function init() {
        // Wait for supabase-js
        for (let i = 0; i < 60 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));
        if (!window.supabase) return renderLocked();
        sb = window.__WS_SB__ || window.__WS_PRESENCE_SB__ || null;
        if (!sb) {
            try {
                const r = await fetch('/api/config');
                const cfg = await r.json();
                if (!cfg?.supabaseUrl || !cfg?.supabaseAnonKey) return renderLocked();
                sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
                    auth: { persistSession: true, autoRefreshToken: true }
                });
            } catch { return renderLocked(); }
        }

        const { data: { session } } = await sb.auth.getSession();
        if (!session) return renderLocked();
        user = session.user;

        // Load profile to check is_wfh
        try {
            const { data } = await sb.from('profiles')
                .select('id, full_name, email, is_wfh')
                .eq('id', user.id)
                .maybeSingle();
            profile = data;
        } catch {}

        if (!profile?.is_wfh) return renderNotWFH();
        if (!todaysFriday()) return renderNotFriday();
        renderRecorder();
    }

    // ---------- Gate states ----------
    function renderLocked() {
        document.getElementById('body').innerHTML = `
            <div class="card gate locked">
                <div class="gate-ic">🔐</div>
                <h2>Sign in required</h2>
                <p>Log into WorkSuite first, then open this page again to submit your Friday check-in.</p>
                <a href="/" class="btn primary" style="text-decoration:none;">Go to Login</a>
            </div>`;
    }

    function renderNotWFH() {
        document.getElementById('body').innerHTML = `
            <div class="card gate wfh">
                <div class="gate-ic">🏢</div>
                <h2>Not a WFH day for you</h2>
                <p>The Friday video check-in is only for employees your admin has marked as <b>WFH</b>. If you think this is a mistake, message your admin on Chat.</p>
                <a href="/chat/" class="btn primary" style="text-decoration:none;">Message admin</a>
            </div>`;
    }

    function renderNotFriday() {
        const next = nextFriday();
        const today = new Date();
        // Build a Sun–Sat strip with Friday and today highlighted
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const stripHtml = days.map((label, idx) => {
            const cls = ['d'];
            if (idx === today.getDay())  cls.push('today');
            if (idx === 5)               cls.push('friday');
            return `<div class="${cls.join(' ')}">${label}</div>`;
        }).join('');
        const daysUntil = Math.round((next - today) / 86_400_000);
        const when = daysUntil <= 1 ? 'tomorrow' : `in ${daysUntil} days`;
        document.getElementById('body').innerHTML = `
            <div class="card gate calendar">
                <div class="gate-ic">📅</div>
                <h2>Come back on Friday</h2>
                <p>The video check-in only opens on Fridays. Your next window is <b>${fmtDate(next)}</b> — that's ${when}.</p>
                <div class="day-strip">${stripHtml}</div>
                <p style="font-size:12px; color:#64748b; margin-top:6px;">The button will unlock automatically when Friday rolls around.</p>
            </div>`;
    }

    function renderRecorder() {
        const today = todaysFriday();
        document.getElementById('hero-sub').textContent = `Submit your ${fmtDate(today)} check-in`;
        document.getElementById('body').innerHTML = `
            <div class="rules">
                <strong>📋 What to record</strong>
                <ul>
                    <li>Use your <b>back camera</b> to slowly pan around your workspace and show your surroundings.</li>
                    <li>Keep it <b>15–60 seconds</b> long — no need for anything longer.</li>
                    <li>Videos are private — only you and your admin can see them.</li>
                    <li>You get one submission per Friday. Re-record until you're happy, then hit <b>Submit</b>.</li>
                </ul>
            </div>

            <div class="card">
                <div id="camera-shell">
                    <video id="stream" class="stream" playsinline muted autoplay style="display:none;"></video>
                    <video id="preview" class="preview" playsinline controls style="display:none;"></video>
                    <div id="camera-placeholder" style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0b1120;border-radius:18px;border:1px dashed rgba(255,255,255,0.12);color:#64748b;text-align:center;padding:20px;">
                        <div style="font-size:44px;margin-bottom:10px;">📷</div>
                        <div style="font-weight:800;color:#cbd5e1;font-size:15px;">Ready to record</div>
                        <div style="font-size:12px;margin-top:6px;">Tap <b>Open camera</b> to preview. You'll be asked to allow camera access.</div>
                    </div>
                </div>

                <div class="action-row">
                    <button id="btn-open" class="btn primary" type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        Open camera
                    </button>
                    <button id="btn-flip"    class="btn" type="button" style="display:none;">🔄 Flip camera</button>
                    <button id="btn-start"   class="btn record" type="button" style="display:none;">Start Recording</button>
                    <button id="btn-stop"    class="btn record" type="button" style="display:none;">Stop</button>
                    <button id="btn-retake"  class="btn" type="button" style="display:none;">Re-record</button>
                    <span id="rec-status" class="rec-status">Idle</span>
                </div>

                <div id="progress" class="progress-bar"><div id="progress-fill" class="fill"></div></div>

                <div class="action-row" style="justify-content:flex-end;">
                    <button id="btn-submit" class="btn primary" type="button" style="display:none;" disabled>
                        Submit Weekly Check-in
                    </button>
                </div>

                <p id="err" style="display:none; color:#fca5a5; font-size:12px; font-weight:700; margin-top:8px;"></p>
            </div>

            <div id="history" class="history" style="display:none;">
                <h3>📁 My previous check-ins</h3>
                <div id="history-list"></div>
            </div>`;
        wireRecorder();
        loadHistory();
        // If already submitted today, jump to done state
        checkTodaySubmission();
    }

    async function checkTodaySubmission() {
        try {
            const wo = ymd(todaysFriday());
            const { data } = await sb.from('wfh_recordings').select('id, video_path').eq('user_id', user.id).eq('week_of', wo).maybeSingle();
            if (data?.video_path) {
                // Already submitted today
                document.getElementById('camera-shell').innerHTML = `
                    <div style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(16,185,129,0.10);border-radius:18px;border:1px solid rgba(16,185,129,0.35);color:#6ee7b7;text-align:center;padding:20px;">
                        <div style="font-size:56px;margin-bottom:10px;">✅</div>
                        <div style="font-weight:900;color:#fff;font-size:18px;">You're done for today!</div>
                        <div style="font-size:13px;margin-top:6px;color:#a7f3d0;">Your ${fmtDate(todaysFriday())} check-in is saved. See you next Friday.</div>
                    </div>`;
                document.getElementById('btn-open').style.display = 'none';
            }
        } catch {}
    }

    // ---------- Recorder wiring ----------
    let currentFacing = 'environment'; // back camera by default

    function wireRecorder() {
        document.getElementById('btn-open').addEventListener('click',  () => openCamera(currentFacing));
        document.getElementById('btn-flip').addEventListener('click',  flipCamera);
        document.getElementById('btn-start').addEventListener('click', startRec);
        document.getElementById('btn-stop').addEventListener('click',  stopRec);
        document.getElementById('btn-retake').addEventListener('click', retakeRec);
        document.getElementById('btn-submit').addEventListener('click', submitRec);
    }

    async function openCamera(facing) {
        const err = document.getElementById('err');
        err.style.display = 'none';
        if (!navigator.mediaDevices?.getUserMedia) {
            err.textContent = 'Your browser does not support camera access. Please use Chrome or Safari.';
            err.style.display = 'block';
            return;
        }
        try {
            if (stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: true
            });
            const vid = document.getElementById('stream');
            vid.srcObject = stream;
            vid.style.display = 'block';
            document.getElementById('camera-placeholder').style.display = 'none';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('btn-open').style.display  = 'none';
            document.getElementById('btn-start').style.display = 'inline-flex';
            document.getElementById('btn-flip').style.display  = 'inline-flex';
            document.getElementById('btn-retake').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'none';
            currentFacing = facing;
        } catch (e) {
            err.textContent = 'Could not open camera: ' + (e.message || 'permission denied');
            err.style.display = 'block';
        }
    }

    async function flipCamera() {
        currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
        await openCamera(currentFacing);
    }

    async function startRec() {
        if (!stream) return;
        let mime = 'video/webm;codecs=vp9,opus';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4'; // Safari fallback
        const chunks = [];
        recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 900_000 });
        recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        const startAt = Date.now();
        recorder.onstop = () => {
            recBlob = new Blob(chunks, { type: mime });
            recSecs = Math.round((Date.now() - startAt) / 1000);
            const url = URL.createObjectURL(recBlob);
            const p = document.getElementById('preview');
            p.src = url; p.style.display = 'block';
            document.getElementById('stream').style.display = 'none';
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display  = 'none';
            document.getElementById('btn-flip').style.display  = 'none';
            document.getElementById('btn-retake').style.display = 'inline-flex';
            document.getElementById('btn-submit').style.display = 'inline-flex';
            document.getElementById('btn-submit').disabled = false;
            const sizeMB = (recBlob.size / (1024*1024)).toFixed(1);
            const s = document.getElementById('rec-status');
            s.className = 'rec-status done';
            s.textContent = `● Ready · ${recSecs}s · ${sizeMB} MB`;
            clearInterval(recTicker);
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        };
        recorder.start(1000);
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-stop').style.display  = 'inline-flex';
        document.getElementById('btn-flip').style.display  = 'none';
        const s = document.getElementById('rec-status');
        s.className = 'rec-status live';
        recTicker = setInterval(() => {
            const secs = Math.floor((Date.now() - startAt) / 1000);
            s.textContent = `● REC · ${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
            if (secs >= 90) stopRec(); // hard cap 90s
        }, 250);
    }

    function stopRec() { try { recorder?.stop(); } catch {} }

    async function retakeRec() {
        recBlob = null; recSecs = 0;
        document.getElementById('preview').src = '';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('btn-retake').style.display = 'none';
        document.getElementById('btn-submit').style.display = 'none';
        const s = document.getElementById('rec-status');
        s.className = 'rec-status'; s.textContent = 'Idle';
        await openCamera(currentFacing);
    }

    async function submitRec() {
        if (!recBlob) return;
        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        const bar = document.getElementById('progress');
        const fill = document.getElementById('progress-fill');
        bar.classList.add('show');
        try {
            const wo = ymd(todaysFriday());
            const ext = recBlob.type.includes('mp4') ? 'mp4' : 'webm';
            const path = `${user.id}/${wo}/checkin.${ext}`;
            fill.style.width = '30%';
            const { error: upErr } = await sb.storage.from('wfh-recordings').upload(path, recBlob, {
                upsert: true,
                contentType: recBlob.type,
                cacheControl: '3600',
            });
            if (upErr) throw upErr;
            fill.style.width = '80%';
            const { error: metaErr } = await sb.from('wfh_recordings').upsert({
                user_id: user.id,
                full_name: profile?.full_name || user.user_metadata?.full_name || null,
                email: user.email,
                week_of: wo,
                video_path: path,
                video_bytes: recBlob.size,
                video_secs: recSecs,
            }, { onConflict: 'user_id,week_of' });
            if (metaErr) throw metaErr;
            fill.style.width = '100%';
            toast('✅ Submitted! See you next Friday.', 'success');
            setTimeout(() => { checkTodaySubmission(); loadHistory(); }, 800);
        } catch (e) {
            console.error(e);
            toast('Upload failed: ' + (e.message || 'unknown error'), 'error');
            btn.disabled = false;
            bar.classList.remove('show');
        }
    }

    async function loadHistory() {
        try {
            const { data } = await sb.from('wfh_recordings')
                .select('week_of, video_secs, created_at')
                .eq('user_id', user.id)
                .order('week_of', { ascending: false })
                .limit(12);
            if (!data || !data.length) return;
            const wrap = document.getElementById('history');
            wrap.style.display = 'block';
            document.getElementById('history-list').innerHTML = data.map(r => {
                const d = new Date(r.week_of + 'T00:00');
                return `
                    <div class="h-row">
                        <div><b>${d.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'short', year:'numeric' })}</b> · ${r.video_secs || 0}s clip</div>
                        <div class="tag">Submitted</div>
                    </div>`;
            }).join('');
        } catch {}
    }

    function toast(msg, kind) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + (kind || '');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove('show'), 3500);
    }

    init();
</script>
</body>
</html>
