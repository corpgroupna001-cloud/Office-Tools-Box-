plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worksuite.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.worksuite.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        // The site the app opens. A staging build passes -PworksuiteUrl=…
        buildConfigField "String", "SITE_URL", "\"${project.findProperty('worksuiteUrl') ?: 'https://work-suite-mauve.vercel.app'}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
